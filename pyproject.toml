[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krishak-robot"
version = "0.1.0"
description = "Vision-guided agricultural mobile manipulation prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.9,<5"]

[project.scripts]
krishak = "krishak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
